<script>
(function () {
  var theme = null;
  try { theme = localStorage.getItem('wtkl.theme'); } catch (e) {}
  if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  try {
    var court = /[?&]court=([01])/.exec(location.search);
    if (court) localStorage.setItem('wtkl.court', court[1]);
    if (localStorage.getItem('wtkl.court') !== '0') document.documentElement.setAttribute('data-court', '');
  } catch (e) {}
  if (theme === 'dark') document.querySelector('meta[name=theme-color]').setAttribute('content', '#16171b');
})();
</script>
